name: duolingo_quran
description: A Duolingo-style app for learning and memorizing the Quran.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_fonts: ^6.1.0
  animations: ^2.0.11
  flutter_svg: ^2.0.9
  audioplayers: ^6.0.0
  lottie: ^3.1.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran_data.json
    - assets/data/surah_info.json
